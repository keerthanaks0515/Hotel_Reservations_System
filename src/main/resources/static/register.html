<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account | Grand Heritage Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #0f1a2d 0%, #1a2b49 100%); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Header -->
  <header style="padding: 24px 0; text-align: center;">
    <a href="/index.html" class="navbar-brand" style="color: #ffffff; justify-content: center;">
      <i class="fas fa-hotel" style="color: var(--gold);"></i>
      <span>Grand Heritage Hotel</span>
    </a>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #ffffff; width: 100%; max-width: 480px; padding: 36px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.8rem; margin-bottom: 6px;">Create Guest Account</h1>
        <p style="color: var(--text-muted); font-size: 0.92rem;">Enjoy effortless reservations, instant confirmations, and stay management.</p>
      </div>

      <form id="register-form">
        <div class="form-group" style="margin-bottom: 16px;">
          <label>Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. John Doe" required>
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label>Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label>Password (At least 6 characters)</label>
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label>Phone Number (Optional)</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 000-0000">
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-gold btn-block btn-lg" style="margin-bottom: 16px;">
          Complete Registration <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div style="text-align: center; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 16px;">
        Already have an account? <a href="/login.html" style="font-weight: 600; color: var(--gold-hover);">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const regForm = document.getElementById('register-form');
      regForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const phone = document.getElementById('reg-phone').value;

        const btn = document.getElementById('reg-submit-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

        try {
          const res = await apiRequest('/auth/register', {
            method: 'POST',
            body: JSON.stringify({ fullName, email, password, phone })
          });

          if (res.success && res.data) {
            Auth.setAuth(res.data);
            showToast('Account registered successfully! Welcome to Grand Heritage.', 'success');
            setTimeout(() => {
              window.location.href = '/rooms.html';
            }, 800);
          }
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = 'Complete Registration <i class="fas fa-arrow-right"></i>';
        }
      });
    });
  </script>
</body>
</html>
