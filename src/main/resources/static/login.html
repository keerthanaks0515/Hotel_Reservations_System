<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Grand Heritage Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #0f1a2d 0%, #1a2b49 100%); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Header -->
  <header style="padding: 24px 0; text-align: center;">
    <a href="/index.html" class="navbar-brand" style="color: #ffffff; justify-content: center;">
      <i class="fas fa-hotel" style="color: var(--gold);"></i>
      <span>Grand Heritage Hotel</span>
    </a>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #ffffff; width: 100%; max-width: 440px; padding: 36px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.8rem; margin-bottom: 6px;">Sign In to Account</h1>
        <p style="color: var(--text-muted); font-size: 0.92rem;">Access your reservations and personalized hospitality perks.</p>
      </div>

      <!-- Quick Demo Access Pills -->
      <div class="demo-quick-fill">
        <span><i class="fas fa-key" style="color: var(--gold-hover);"></i> Quick Demo Sign-In (1-Click):</span>
        <div class="demo-pills">
          <button type="button" class="demo-btn" onclick="fillAndLogin('john@example.com', 'Customer@123')">
            <i class="fas fa-user"></i> Customer Demo
          </button>
          <button type="button" class="demo-btn" onclick="fillAndLogin('admin@hotel.com', 'Admin@123')">
            <i class="fas fa-user-shield"></i> Admin Demo
          </button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom: 16px;">
          <label>Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label>Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 16px;">
          Sign In <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div style="text-align: center; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 16px;">
        Do not have an account yet? <a href="/register.html" style="font-weight: 600; color: var(--gold-hover);">Register here</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        await executeLogin(email, password);
      });
    });

    function fillAndLogin(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
      executeLogin(email, password);
    }

    async function executeLogin(email, password) {
      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

      try {
        const res = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (res.success && res.data) {
          Auth.setAuth(res.data);
          showToast(`Welcome back, ${res.data.fullName}!`, 'success');

          setTimeout(() => {
            if (res.data.role === 'ROLE_ADMIN') {
              window.location.href = '/admin.html';
            } else {
              const params = new URLSearchParams(window.location.search);
              const redirect = params.get('redirect');
              window.location.href = redirect || '/my-bookings.html';
            }
          }, 800);
        }
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Sign In <i class="fas fa-arrow-right"></i>';
      }
    }
  </script>
</body>
</html>
