# ==============================================================================
# HOTEL RESERVATION & MANAGEMENT SYSTEM - CONFIGURATION
# ==============================================================================

spring.application.name=CodeAlpha_HotelReservationSystem
server.port=8080

# Profile selection: 'default' uses embedded H2 for instant zero-config testing.
# Set 'spring.profiles.active=mysql' to connect to local/production MySQL.
# spring.profiles.active=mysql

# ------------------------------------------------------------------------------
# Default Embedded Database (H2 In-Memory)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:hotel_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# JWT Security Configuration
# ------------------------------------------------------------------------------
# In production, supply APP_JWT_SECRET through an environment variable
app.jwt.secret=${APP_JWT_SECRET:HotelReservationSuperSecretSigningKeyForJwtTokens2026!}
app.jwt.expiration-milliseconds=86400000

# ------------------------------------------------------------------------------
# JSON Serialization & MVC
# ------------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
